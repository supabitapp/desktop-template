name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build deps and Mesa's software Vulkan
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev mesa-vulkan-drivers
      - run: cargo build --locked --release
      - name: Render hello world headless
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            export VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          fi
          ./target/release/desktop-template --snap hello-${{ runner.os }}.png
      - uses: actions/upload-artifact@v4
        with:
          name: hello-${{ runner.os }}
          path: hello-${{ runner.os }}.png
