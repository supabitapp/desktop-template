[tools]
mr-boxington = "1.29.2"
rust = { version = "1.99.1", components = "clippy,rustfmt", profile = "minimal", mr_boxington = true }

[tasks.dev]
description = "Open the window"
run = "cargo run"

[tasks.snap]
description = "Render headless to a PNG"
usage = 'arg "[out]" default="hello.png"'
run = 'cargo run --locked -- --snap ${usage_out}'

[tasks.fmt]
description = "Format the code"
run = "cargo fmt"

[tasks.lint]
description = "Check formatting and clippy"
run = [
  "cargo fmt --check",
  "cargo clippy --locked --all-targets -- -D warnings",
]

[tasks.build]
description = "Build the release executable"
run = "cargo build --locked --release"

[tasks.ci]
description = "Everything CI runs"
depends = ["lint", "build"]

[tasks.ios]
description = "Build the iOS app for the simulator"
tools = { xcodegen = "2.48.0" }
dir = "ios"
run = [
  "xcodegen generate --quiet",
  "xcodebuild -project Template.xcodeproj -scheme Template -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet build",
]

[tasks.android]
description = "Build the Android debug APK"
tools = { java = "temurin-17" }
dir = "android"
run = "./gradlew --no-daemon assembleDebug"
